<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipbara</title>
  <style>
    :root {
      --bg-primary-light: #FFFFFF;
      --bg-secondary-light: #F5F5F7;
      --bg-tertiary-light: #EBEBF0;
      --text-primary-light: #000000;
      --text-secondary-light: #3C3C43;
      --text-tertiary-light: #8E8E93;
      --border-primary-light: #E5E5EA;

      --bg-primary-dark: #000000;
      --bg-secondary-dark: #1C1C1E;
      --bg-tertiary-dark: #2C2C2E;
      --text-primary-dark: #FFFFFF;
      --text-secondary-dark: #EBEBF5;
      --text-tertiary-dark: #8E8E93;
      --border-primary-dark: #38383A;

      --accent-blue: #0A84FF;
      --accent-green: #34C759;
      --accent-red: #FF3B30;
      --accent-orange: #FF9500;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: var(--bg-primary-dark);
        --bg-secondary: var(--bg-secondary-dark);
        --bg-tertiary: var(--bg-tertiary-dark);
        --text-primary: var(--text-primary-dark);
        --text-secondary: var(--text-secondary-dark);
        --text-tertiary: var(--text-tertiary-dark);
        --border-primary: var(--border-primary-dark);
      }
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-primary: var(--bg-primary-light);
        --bg-secondary: var(--bg-secondary-light);
        --bg-tertiary: var(--bg-tertiary-light);
        --text-primary: var(--text-primary-light);
        --text-secondary: var(--text-secondary-light);
        --text-tertiary: var(--text-tertiary-light);
        --border-primary: var(--border-primary-light);
      }
    }

    :root[data-theme="dark"] {
      --bg-primary: var(--bg-primary-dark);
      --bg-secondary: var(--bg-secondary-dark);
      --bg-tertiary: var(--bg-tertiary-dark);
      --text-primary: var(--text-primary-dark);
      --text-secondary: var(--text-secondary-dark);
      --text-tertiary: var(--text-tertiary-dark);
      --border-primary: var(--border-primary-dark);
    }

    :root[data-theme="light"] {
      --bg-primary: var(--bg-primary-light);
      --bg-secondary: var(--bg-secondary-light);
      --bg-tertiary: var(--bg-tertiary-light);
      --text-primary: var(--text-primary-light);
      --text-secondary: var(--text-secondary-light);
      --text-tertiary: var(--text-tertiary-light);
      --border-primary: var(--border-primary-light);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-primary);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      overflow-y: auto;
    }

    .sidebar-section {
      padding: 0 12px;
      margin-bottom: 12px;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      margin-bottom: 4px;
    }

    .sidebar-item {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background: var(--bg-tertiary);
      color: var(--accent-blue);
      font-weight: 600;
    }

    .sidebar-icon {
      font-size: 14px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      max-width: 300px;
      background: var(--bg-primary);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
    }

    .search-box::placeholder {
      color: var(--text-tertiary);
    }

    .search-box:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.1);
    }

    .toolbar-button {
      background: transparent;
      border: 1px solid var(--border-primary);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 150ms;
    }

    .toolbar-button:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* Quick Access */
    .quick-access {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      padding: 12px 16px;
    }

    .quick-access-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quick-tiles {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 4px;
    }

    .quick-tiles::-webkit-scrollbar {
      height: 6px;
    }

    .quick-tiles::-webkit-scrollbar-thumb {
      background: var(--border-primary);
      border-radius: 3px;
    }

    .quick-tile {
      flex-shrink: 0;
      width: 80px;
      height: 80px;
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      background: var(--bg-primary);
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    .quick-tile:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.2);
      transform: translateY(-2px);
    }

    .quick-tile-preview {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent-blue), rgba(10, 132, 255, 0.4));
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quick-tile-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-tertiary);
    }

    .pin-icon {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 150ms;
    }

    .quick-tile.pinned .pin-icon {
      opacity: 1;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .clipboard-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 150ms;
      position: relative;
      overflow: hidden;
      group: 1;
    }

    .clipboard-item:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.15);
      transform: translateY(-1px);
    }

    .clipboard-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .clipboard-item-type {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: var(--bg-tertiary);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .clipboard-item-icon {
      font-size: 14px;
    }

    .clipboard-item-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 150ms;
    }

    .clipboard-item:hover .clipboard-item-actions {
      opacity: 1;
    }

    .item-action-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 150ms;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-action-btn:hover {
      background: var(--bg-tertiary);
    }

    .clipboard-item-preview {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, var(--accent-blue), rgba(10, 132, 255, 0.2));
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .clipboard-item-content {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 8px;
      min-height: 28px;
    }

    .clipboard-item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .copy-badge {
      background: var(--accent-green);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 300ms;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .clipboard-item.copied .copy-badge {
      opacity: 1;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .theme-toggle {
      background: var(--bg-primary);
      border: 1px solid var(--border-primary);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
      transition: all 150ms;
    }

    .theme-toggle:hover {
      background: var(--bg-tertiary);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-tertiary);
      text-align: center;
      padding: 40px;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    @media (max-width: 1024px) {
      .sidebar {
        width: 160px;
      }

      .content-area {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .content-area {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar (like Paste) -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-item active">
          <span class="sidebar-icon">📋</span>
          <span>Recent</span>
        </div>
        <div class="sidebar-item">
          <span class="sidebar-icon">⭐</span>
          <span>Pinned</span>
        </div>
        <div class="sidebar-item">
          <span class="sidebar-icon">🔍</span>
          <span>Search</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Collections</div>
        <div class="sidebar-item">
          <span class="sidebar-icon">🎨</span>
          <span>Design</span>
        </div>
        <div class="sidebar-item">
          <span class="sidebar-icon">💻</span>
          <span>Code</span>
        </div>
        <div class="sidebar-item">
          <span class="sidebar-icon">📸</span>
          <span>Screenshots</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Settings</div>
        <div class="sidebar-item">
          <span class="sidebar-icon">⚙️</span>
          <span>Preferences</span>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <div class="header">
        <h1 class="header-title">Clipbara</h1>
        <div class="header-actions">
          <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" class="search-box" placeholder="Search clipboard history..." id="searchBox">
        <button class="toolbar-button">↪️ Paste & Delete</button>
        <button class="toolbar-button">📌 Pin</button>
      </div>

      <!-- Quick Access (like Paste's favorites) -->
      <div class="quick-access">
        <div class="quick-access-label">⭐ Pinned</div>
        <div class="quick-tiles" id="quickTiles"></div>
      </div>

      <!-- Content Grid (inspired by Paste's visual layout) -->
      <div class="content-area" id="contentArea"></div>
    </div>
  </div>

  <script>
    const searchBox = document.getElementById('searchBox');
    const contentArea = document.getElementById('contentArea');
    const quickTiles = document.getElementById('quickTiles');
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;

    // Theme
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) {
      html.setAttribute('data-theme', 'dark');
    }

    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
    });

    // Sample data (inspired by real clipboard use cases)
    const clipboardItems = [
      { id: 1, type: 'image', label: 'Screenshot', icon: '📸', content: 'Design System Screenshot.png', time: '2 min ago', pinned: true },
      { id: 2, type: 'code', label: 'Code', icon: '</>', content: 'const design = { colors: [...], spacing: [...] }', time: '5 min ago', pinned: true },
      { id: 3, type: 'url', label: 'Link', icon: '🔗', content: 'https://github.com/mobrava/Clipbara', time: '12 min ago', pinned: false },
      { id: 4, type: 'text', label: 'Text', icon: '📝', content: 'Apple-native design system with semantic colors and complete component library', time: '18 min ago', pinned: false },
      { id: 5, type: 'image', label: 'Image', icon: '🖼️', content: 'design-tokens.pdf', time: '34 min ago', pinned: false },
      { id: 6, type: 'code', label: 'Code', icon: '</>', content: 'function applyTheme(theme) { ... }', time: '1 hour ago', pinned: false },
      { id: 7, type: 'text', label: 'Text', icon: '📝', content: 'Quick Access Tiles - visual preview, hover shows tooltip', time: '2 hours ago', pinned: false },
      { id: 8, type: 'file', label: 'File', icon: '📄', content: 'clipbara-design-system.html', time: '3 hours ago', pinned: false },
    ];

    function renderItems(items) {
      contentArea.innerHTML = items.length ? '' : `
        <div class="empty-state" style="grid-column: 1 / -1;">
          <div class="empty-state-icon">📋</div>
          <div class="empty-state-title">No items</div>
          <div>Copy something to get started</div>
        </div>
      `;

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'clipboard-item';
        el.innerHTML = `
          <div class="clipboard-item-header">
            <div class="clipboard-item-type">
              <span class="clipboard-item-icon">${item.icon}</span>
              ${item.type}
            </div>
            <div class="clipboard-item-actions">
              <button class="item-action-btn" title="Copy">📋</button>
              <button class="item-action-btn" title="Pin">📌</button>
              <button class="item-action-btn" title="Delete">✕</button>
            </div>
          </div>
          <div class="clipboard-item-preview"></div>
          <div class="clipboard-item-content">${item.content}</div>
          <div class="clipboard-item-footer">
            <span>${item.time}</span>
          </div>
          <div class="copy-badge">✓ Copied</div>
        `;

        el.addEventListener('click', () => {
          el.classList.add('copied');
          setTimeout(() => el.classList.remove('copied'), 1500);
        });

        contentArea.appendChild(el);
      });
    }

    function renderQuickTiles() {
      const pinned = clipboardItems.filter(i => i.pinned);
      quickTiles.innerHTML = pinned.map(item => `
        <div class="quick-tile pinned">
          <div class="quick-tile-preview">${item.icon}</div>
          <div class="quick-tile-label">${item.type}</div>
          <div class="pin-icon">📌</div>
        </div>
      `).join('');
    }

    searchBox.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = clipboardItems.filter(item =>
        item.content.toLowerCase().includes(query) ||
        item.type.toLowerCase().includes(query)
      );
      renderItems(filtered);
    });

    // Initial render
    renderItems(clipboardItems);
    renderQuickTiles();
  </script>
</body>
</html>
